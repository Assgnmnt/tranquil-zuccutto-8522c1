<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Jackie Parker  -  The Assignment Room™</title>
<meta name="description" content="After more than 20 years leading people, culture, leadership, and belonging strategy at the enterprise level, Jackie Parker created The Assignment Room™ for women who are not lacking capacity  -  they are carrying something that needs language, structure, and movement." />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream:    #F8F4EE;
    --cream-dk: #EDE8E0;
    --teal:     #058E97;
    --teal-lt:  #E8F5F6;
    --gold:     #C9A84C;
    --charcoal: #1C1C1A;
    --mid:      #5A5A56;
    --border:   #DDD8D0;
    --num-color: #7A7068;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans:  'DM Sans', sans-serif;
    --max: 1080px;
    --pad: clamp(1.25rem, 5vw, 2.5rem);
  }
  html { font-size: 16px; scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: var(--font-sans);
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem var(--pad); border-bottom: 1px solid var(--border);
    background: var(--cream); position: sticky; top: 0; z-index: 100;
  }
  .nav-logo {
    font-family: var(--font-serif); font-size: 1.05rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--charcoal); text-decoration: none;
  }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-size: 0.78rem; font-weight: 400; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--mid); text-decoration: none; transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--teal); }
  .nav-links a.active { color: var(--teal); }
  @media (max-width: 640px) { .nav-links { display: none; } }

  /* LAYOUT */
  .inner { max-width: var(--max); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }
  .section-label {
    display: inline-block; font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: #047A82; margin-bottom: 1.25rem;
  }
  section { padding: 4.5rem 0; }
  section + section { border-top: 1px solid var(--border); }

  /* HERO  -  portrait + intro split */
  .hero {
    padding: 5rem var(--pad) 4.5rem; border-bottom: 1px solid var(--border);
    max-width: var(--max); margin: 0 auto;
    display: grid; grid-template-columns: 340px 1fr; gap: 5rem; align-items: start;
  }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; gap: 3rem; padding: 3rem var(--pad); } }

  /* Portrait block */
  .portrait-block {}
  .portrait-frame {
    width: 100%; aspect-ratio: 3/4; background: var(--cream-dk);
    border: 1px solid var(--border); position: relative;
    overflow: hidden; margin-bottom: 1.5rem;
  }
  .portrait-frame img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block;
  }
  .portrait-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.75rem; padding: 2rem;
  }
  .portrait-placeholder svg { width: 40px; height: 40px; stroke: var(--border); fill: none; stroke-width: 1; }
  .portrait-placeholder-text {
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--border); text-align: center; line-height: 1.6;
  }
  .portrait-caption {
    font-family: var(--font-serif); font-size: 0.88rem; color: var(--mid);
    font-style: italic; line-height: 1.5; padding-left: 1rem;
    border-left: 2px solid var(--border);
  }

  /* Hero right */
  .hero-right {}
  .hero-eyebrow { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; }
  .eyebrow-rule { width: 28px; height: 1px; background: var(--gold); }
  .eyebrow-text { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid); }
  .hero-right h1 {
    font-family: var(--font-serif); font-size: clamp(2.4rem, 5.5vw, 3.8rem);
    font-weight: 400; line-height: 1.1; color: var(--charcoal); margin-bottom: 0.35rem;
  }
  .hero-right h1 em { font-style: italic; color: var(--teal); }
  .hero-title {
    font-size: 0.78rem; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--mid); margin-bottom: 2rem;
  }
  .hero-rule { width: 40px; height: 2px; background: var(--gold); margin: 1.75rem 0; }
  .hero-positioning {
    font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400;
    line-height: 1.5; color: var(--charcoal); margin-bottom: 1.5rem; max-width: 520px;
  }
  .hero-positioning em { font-style: italic; color: var(--teal); }
  .hero-desc { font-size: 0.92rem; color: var(--mid); line-height: 1.85; max-width: 500px; }

  .credential-pills {
    display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 2rem;
  }
  .pill {
    font-size: 0.7rem; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--charcoal);
    background: var(--cream-dk); border: 1px solid var(--border);
    padding: 0.35rem 0.85rem;
  }

  /* BUILT BY SECTION  -  story */
  .story-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start;
  }
  @media (max-width: 720px) { .story-grid { grid-template-columns: 1fr; gap: 2.5rem; } }
  .story-left {}
  .story-left p {
    font-size: 0.92rem; color: var(--mid); line-height: 1.9; margin-bottom: 1.25rem;
  }
  .story-left p:last-child { margin-bottom: 0; }
  .story-pull {
    border-left: 3px solid var(--teal); padding: 1.25rem 1.5rem;
    background: var(--teal-lt); margin: 2rem 0;
  }
  .story-pull p {
    font-family: var(--font-serif); font-style: italic;
    font-size: 1.2rem; color: var(--charcoal); line-height: 1.55; margin: 0 !important;
  }

  .story-right {}

  /* ENTERPRISE BACKGROUND */
  .background-block {
    background: var(--charcoal); padding: 4.5rem 0;
  }
  .background-inner {
    max-width: var(--max); margin: 0 auto; padding: 0 var(--pad);
    display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start;
  }
  @media (max-width: 720px) { .background-inner { grid-template-columns: 1fr; gap: 2.5rem; } }
  .bg-left .section-label { color: #9acdcf; }
  .bg-left h2 { font-family: var(--font-serif); font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 400; color: var(--cream); line-height: 1.2; margin-bottom: 1.25rem; }
  .bg-left p { font-size: 0.9rem; color: #b0ada8; line-height: 1.85; margin-bottom: 1rem; }
  .bg-left p:last-child { margin-bottom: 0; }
  .bg-right {}
  .expertise-list { list-style: none; }
  .expertise-item {
    padding: 1.1rem 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: grid; grid-template-columns: 2rem 1fr; gap: 1rem; align-items: start;
  }
  .expertise-item:first-child { padding-top: 0; }
  .expertise-item:last-child { border-bottom: none; }
  .ei-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--teal);
    margin-top: 0.55rem; flex-shrink: 0;
  }
  .ei-name { font-family: var(--font-serif); font-size: 1rem; font-weight: 500; color: var(--cream); margin-bottom: 0.25rem; }
  .ei-desc { font-size: 0.82rem; color: #6a6a66; line-height: 1.6; }

  /* THE METHODOLOGY */
  .method-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--border); border: 1px solid var(--border);
  }
  @media (max-width: 640px) { .method-grid { grid-template-columns: 1fr; } }
  .method-item { background: #fff; padding: 2.5rem 2rem; }
  .mi-num {
    font-family: var(--font-serif); font-size: 2.5rem; font-weight: 300;
    color: #7A7068; line-height: 1; margin-bottom: 1rem;
  }
  .mi-pillar {
    font-size: 0.67rem; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--teal); margin-bottom: 0.5rem;
  }
  .mi-title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 500; color: var(--charcoal); margin-bottom: 0.6rem; line-height: 1.3; }
  .mi-desc { font-size: 0.85rem; color: var(--mid); line-height: 1.75; }
  .mi-from {
    margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border);
    font-size: 0.75rem; color: var(--charcoal); line-height: 1.5;
  }
  .mi-from-label { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); margin-bottom: 0.25rem; }

  /* DIRECT ADDRESS */
  .direct-address {
    max-width: 720px; margin: 0 auto; text-align: center;
  }
  .da-intro {
    font-size: 0.7rem; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--teal); margin-bottom: 1.5rem;
  }
  .da-quote {
    font-family: var(--font-serif); font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    font-weight: 400; line-height: 1.4; color: var(--charcoal); margin-bottom: 2rem;
  }
  .da-quote em { font-style: italic; color: var(--teal); }
  .da-rule { width: 40px; height: 2px; background: var(--gold); margin: 0 auto 1.75rem; }
  .da-body { font-size: 0.92rem; color: var(--mid); line-height: 1.85; max-width: 580px; margin: 0 auto; }

  /* FAITH SECTION */
  .faith-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start;
  }
  @media (max-width: 720px) { .faith-grid { grid-template-columns: 1fr; gap: 2.5rem; } }
  .faith-left p { font-size: 0.92rem; color: var(--mid); line-height: 1.85; margin-bottom: 1rem; }
  .faith-left p:last-child { margin-bottom: 0; }
  .faith-right {}
  .faith-markers { list-style: none; }
  .faith-marker {
    font-family: var(--font-sans); font-style: normal; font-size: 0.88rem;
    color: var(--charcoal); padding: 0.85rem 0 0.85rem 1rem;
    border-bottom: 1px solid var(--border); border-left: 2px solid var(--gold);
    margin-bottom: 0.75rem; line-height: 1.7;
  }
  .faith-marker:last-child { margin-bottom: 0; }

  /* CTA */
  .cta-band {
    background: var(--charcoal); padding: 5rem 0;
  }
  .cta-inner {
    max-width: var(--max); margin: 0 auto; padding: 0 var(--pad);
    display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center;
  }
  @media (max-width: 720px) { .cta-inner { grid-template-columns: 1fr; gap: 2.5rem; } }
  .cta-left .section-label { color: #9acdcf; }
  .cta-left h2 { font-family: var(--font-serif); font-size: clamp(1.75rem, 4vw, 2.75rem); font-weight: 400; color: var(--cream); line-height: 1.2; margin-bottom: 1.25rem; }
  .cta-left p { font-size: 0.9rem; color: #b0ada8; line-height: 1.85; margin-bottom: 0.75rem; }
  .cta-right {}
  .cta-card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-top: 3px solid var(--teal); padding: 2rem;
  }
  .cta-card-label { font-size: 0.67rem; letter-spacing: 0.12em; text-transform: uppercase; color: #9acdcf; margin-bottom: 1rem; }
  .cta-card-name { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 500; color: var(--cream); margin-bottom: 0.75rem; }
  .cta-card-desc { font-size: 0.85rem; color: #b0ada8; line-height: 1.7; margin-bottom: 1.5rem; }
  .cta-card-meta {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.75rem; background: rgba(255,255,255,0.04);
    margin-bottom: 1.25rem; font-size: 0.78rem;
  }
  .cta-card-meta span { color: #6a6a66; }
  .cta-card-meta strong { color: var(--teal); font-weight: 500; }
  .btn-start {
    display: block; text-align: center; font-family: var(--font-sans);
    font-size: 0.78rem; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--charcoal); background: var(--cream);
    text-decoration: none; padding: 0.95rem; transition: background 0.2s;
  }
  .btn-start:hover { background: var(--cream-dk); }
  .cta-card-note {
    margin-top: 0.85rem; font-family: var(--font-serif); font-style: italic;
    font-size: 0.8rem; color: #c8c4be; text-align: center; line-height: 1.5;
  }
  .btn-work {
    display: block; text-align: center; font-family: var(--font-sans);
    font-size: 0.75rem; font-weight: 400; letter-spacing: 0.1em;
    text-transform: uppercase; color: #9acdcf;
    text-decoration: none; padding: 0.65rem;
    border: 1px solid rgba(255,255,255,0.12); margin-top: 0.65rem;
    transition: border-color 0.2s;
  }
  .btn-work:hover { border-color: rgba(255,255,255,0.3); }

  /* FOOTER */
  footer { padding: 3rem var(--pad) 2.5rem; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2rem; max-width: var(--max); margin: 0 auto; }
  @media (max-width: 600px) { footer { grid-template-columns: 1fr; } }
  .footer-logo { font-family: var(--font-serif); font-size: 1rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--charcoal); margin-bottom: 0.5rem; }
  .footer-tagline { font-size: 0.8rem; color: var(--mid); line-height: 1.6; max-width: 220px; }
  .footer-col-title { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); margin-bottom: 1rem; }
  .footer-links { list-style: none; }
  .footer-links li { margin-bottom: 0.5rem; }
  .footer-links a { font-size: 0.82rem; color: var(--charcoal); text-decoration: none; transition: color 0.2s; }
  .footer-links a:hover { color: var(--teal); }
  .footer-bottom { max-width: var(--max); margin: 0 auto; padding: 1.25rem var(--pad); border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--mid); flex-wrap: wrap; gap: 0.5rem; }
</style>
</head>
